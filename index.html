<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- モバイル端末での表示最適化 -->

<style>
body {
    color: #444444; 
    font-family: sans-serif;
    margin: 10px;
    padding: 0;
}
#container {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
#recordingArea, #graphArea {
    border: 1px solid #ccc;
    padding: 10px;
    box-sizing: border-box;
}

canvas {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
}
#controls {
    margin-bottom: 10px;
}
#timer {
    margin-top: 5px;
    font-weight: bold;
    font-size: 14px;
}
#visualizer {
    border: 1px solid #ccc;
    margin-top: 10px;
}
#graphControls {
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}
#graphTypeBtns, .minValBtns, .octaveBtns {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}
#graphTypeBtns button.selected {
    background-color: #4FC3F7; 
}
.minValBtns button.selected {
    background-color: #FFD54F; 
}
.octaveBtns button.selected {
    background-color: #AED581; 
}
#noteSummary {
    display: flex;
    gap: 5px;
    flex-wrap: nowrap;
    overflow-x: auto;
    margin-bottom: 10px;
}
.noteBox {
    display: inline-flex;
    justify-content: center; 
    align-items: center; 
    padding: 3px; 
    color: #444444;
    font-size: 12px;
    text-align: center;
    border-radius: 3px;
    background-color: #f7f7f7; 
    white-space: nowrap; 
    flex-direction: column; 
}
.noteBox div {
    line-height: 1.2;
}
.noteBox div:last-child {
    font-size: 0.3em; 
}

/* グラフ管理エリア */
#graphManagement {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
    align-items: center;
}
#viewModeBtns {
    display: flex;
    gap: 5px;
    margin-right: 10px;
}
#savedGraphsBtns {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
}
.graphBtn {
    border: 1px solid #ccc;
    background: #eee;
    padding: 5px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.graphBtn.selected {
    background: #ccc;
}
.graphCanvasContainer {
    position: relative;
    cursor: pointer; /* クリック可能であることを示す */
}
.graphHeader {
    font-size: 12px;
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.graphHeader span {
    margin-right: 10px;
}
.deleteBtn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px; /* アイコンの大きさ */
    color: #f88; /* ゴミ箱アイコンの色 */
    padding: 5px;
}

.deleteBtn:hover {
    color: #d44; /* ホバー時の色 */
}


/* デフォルトレイアウト(単一表示用) */
#graphsContainer {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* シングルビュー時（1枚表示） */
.singleView #graphsContainer {
    display: flex !important;
    flex-direction: column !important;
    gap: 20px !important;
}
.singleView .graphCanvasContainer canvas {
    width: 90% !important;
    height: auto !important;
}

/* マルチビュー時（4x2表示） */
.multipleView #graphsContainer {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 20px !important;
}
.multipleView .graphCanvasContainer {
    width: 100% !important;
}
.multipleView .graphCanvasContainer canvas {
    width: 100px !important;
    height: 100px !important;
}

@media (max-width: 600px) {
    .multipleView #graphsContainer {
        grid-template-columns: repeat(2, 1fr) !important;
    }
}
</style>

    // グラフ描画用の設定（各グラフは独自canvasを持つ）

                {name:"G3", fStart:190.5, fEnd:201.8, color:"#4DD0E1"},

                {name:"A#3",fStart:226.5, fEnd:240.0, color:"#BA68C8"},
                {name:"B3", fStart:240.0, fEnd:254.3, color:"#F06292"}
            ]
        }
    ];

    function updateGraphTypeSelection(){
        graphTypeBtns.forEach(b=>b.classList.remove('selected'));
        document.querySelector(`.graphTypeBtn[data-type="${currentGraphType}"]`).classList.add('selected');
        redrawAllGraphs();
    }
    function updateMinValSelection(){
        minValBtns.forEach(b=>b.classList.remove('selected'));
        document.querySelector(`.minValBtn[data-min="${intensityMin}"]`).classList.add('selected');
        redrawAllGraphs();
    }
    function updateOctaveSelection() {
        octaveBtns.forEach(btn => {
            const oct = btn.getAttribute('data-oct');
            if (oct === "VC2") {
                if (octaveStates["VC2-1"] && octaveStates["VC2-2"]) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            } else {
                if (octaveStates[oct]) btn.classList.add('selected');
                else btn.classList.remove('selected');
            }
        });
        redrawAllGraphs();
    }

    function updateViewModeButtons() {
        if (singleViewMode) {
            singleViewBtn.style.backgroundColor = '#4FC3F7'; // 1枚表示ボタン強調
            allViewBtn.style.backgroundColor = ''; // 全体表示ボタンリセット
        } else {
            singleViewBtn.style.backgroundColor = ''; // 1枚表示ボタンリセット
            allViewBtn.style.backgroundColor = '#4FC3F7'; // 全体表示ボタン強調
        }

        // 数字ボタンの状態を更新
        updateSavedGraphsButtons();
        redrawAllGraphs(); // グラフの表示を再描画
    }


    updateGraphTypeSelection();
    updateMinValSelection();
    updateOctaveSelection();
    updateViewModeButtons();

    async function initAudio() {
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioContext = new AudioContext();
        mediaStreamSource = audioContext.createMediaStreamSource(audioStream);

        const bufferSize = 4096;
        const recorderNode = audioContext.createScriptProcessor(bufferSize, 1, 1);
        recorderNode.onaudioprocess = (e) => {
            if (!recording) return;
            const inputData = e.inputBuffer.getChannelData(0);
            for (let i = 0; i < inputData.length; i++) {
                recordingData.push(inputData[i]);
            }
        };

        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 2048;

        mediaStreamSource.connect(analyserNode);
        analyserNode.connect(recorderNode);
        recorderNode.connect(audioContext.destination);
    }

    await initAudio();

    startBtn.addEventListener('click', () => {
        if (recording) {
            stopRecording();
            startBtn.innerHTML = '<i class="fas fa-play"></i>';
        } else {
            startRecording();
            startBtn.innerHTML = '<i class="fas fa-stop"></i>';
        }
    });

    graphTypeBtns.forEach(btn=>{
        btn.addEventListener('click',()=>{
            currentGraphType = btn.dataset.type;
            updateGraphTypeSelection();
        });
    });

    minValBtns.forEach(btn=>{
        btn.addEventListener('click',()=>{
            intensityMin = parseInt(btn.getAttribute('data-min'),10);
            updateMinValSelection();
        });
    });

    octaveBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const oct = btn.getAttribute('data-oct');

            if (oct === "VC2") {
                const newState = !(octaveStates["VC2-1"] && octaveStates["VC2-2"]);
                octaveStates["VC2-1"] = newState;
                octaveStates["VC2-2"] = newState;
            } else {
                octaveStates[oct] = !octaveStates[oct];
            }

            updateOctaveSelection();
        });
    });

    singleViewBtn.addEventListener('click', () => {
        singleViewMode = true;
        updateViewModeButtons();
    });

    allViewBtn.addEventListener('click', () => {
        singleViewMode = false;
        updateViewModeButtons();
    });

    function startRecording() {
        if (recordingTimer) {
            clearTimeout(recordingTimer);
            recordingTimer = null;
        }

        recordingData = [];
        recording = true;
        startTime = Date.now();
        timerEl.textContent = `残: ${RECORD_SECONDS.toFixed(1)}s`;

        recordingTimer = setTimeout(() => {
            if (recording) {
                stopRecording();
                processFFT();
            }
        }, RECORD_SECONDS * 1000);

        updateTimer();
        drawWaveform();
    }

    function stopRecording() {
        recording = false;
        if (recordingTimer) {
            clearTimeout(recordingTimer);
            recordingTimer = null;
        }
        cancelAnimationFrame(rafId);
        timerEl.textContent = "";

        // 録音終了後の処理
        singleViewMode = true; // 1枚表示モードに設定
        const lastGraph = savedGraphs[savedGraphs.length - 1];
        if (lastGraph) {
            selectedGraphId = lastGraph.id; // 最後に追加されたグラフを選択
        }
        updateViewModeButtons(); // ビュー切り替えボタン更新
        updateSavedGraphsButtons(); // 数字ボタン更新
        redrawAllGraphs(); // グラフ再描画

        startBtn.innerHTML = '<i class="fas fa-play"></i>';
    }

    function updateTimer() {
        if (!recording) return;
        const elapsed = (Date.now() - startTime) / 1000;
        const remain = Math.max(0, RECORD_SECONDS - elapsed);
        timerEl.textContent = `残: ${remain.toFixed(1)}s`;
        if (remain > 0) {
            requestAnimationFrame(updateTimer);
        }
    }

    function drawWaveform() {
        if (!recording) return;

        const bufferLength = analyserNode.fftSize;
        const dataArray = new Uint8Array(bufferLength);
        analyserNode.getByteTimeDomainData(dataArray);

        vCtx.fillStyle = 'white';
        vCtx.fillRect(0, 0, visualizer.width, visualizer.height);

        vCtx.strokeStyle = '#444444';
        vCtx.beginPath();
        const sliceWidth = visualizer.width * 1.0 / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128.0;
            const y = v * visualizer.height / 2;
            if (i === 0) {
                vCtx.moveTo(x, y);
            } else {
                vCtx.lineTo(x, y);
            }
            x += sliceWidth;
        }
        vCtx.lineTo(visualizer.width, visualizer.height / 2);
        vCtx.stroke();

        rafId = requestAnimationFrame(drawWaveform);
    }

    function fft(inputReal, inputImag) {
        const n = inputReal.length;
        const log2n = Math.log2(n);

        let i, j;
        let bitReversedIndices = new Uint32Array(n);
        for (i = 0; i < n; i++) {
            let rev = 0;
            for (j = 0; j < log2n; j++) {
                rev = (rev << 1) | ((i >>> j) & 1);
            }
            bitReversedIndices[i] = rev;
        }

        const tempReal = new Float32Array(n);
        const tempImag = new Float32Array(n);
        for (i = 0; i < n; i++) {
            tempReal[i] = inputReal[bitReversedIndices[i]];
            tempImag[i] = inputImag[bitReversedIndices[i]];
        }

        for (i = 0; i < n; i++) {
            inputReal[i] = tempReal[i];
            inputImag[i] = tempImag[i];
        }

        for (let size = 2; size <= n; size *= 2) {
            const halfsize = size / 2;
            const tablestep = n / size;
            for (i = 0; i < n; i += size) {
                for (j = i; j < i + halfsize; j++) {
                    const k = (j - i) * tablestep;
                    const angle = (2 * Math.PI * k) / n;
                    const cosVal = Math.cos(angle);
                    const sinVal = Math.sin(angle);

                    const tpre =  cosVal * inputReal[j + halfsize] + sinVal * inputImag[j + halfsize];
                    const tpim = -sinVal * inputReal[j + halfsize] + cosVal * inputImag[j + halfsize];

                    inputReal[j + halfsize] = inputReal[j] - tpre;
                    inputImag[j + halfsize] = inputImag[j] - tpim;
                    inputReal[j] += tpre;
                    inputImag[j] += tpim;
                }
            }
        }
    }

    function processFFT() {
        const sampleRate = audioContext.sampleRate;
        let length = recordingData.length;
        let fftSize = 1;
        while (fftSize * 2 <= length) {
            fftSize *= 2;
        }
    
        if (fftSize < length) {
            recordingData = recordingData.slice(0, fftSize);
        } else if (fftSize > length) {
            const pad = new Float32Array(fftSize);
            pad.set(recordingData);
            recordingData = pad;
        }
    
        const real = new Float32Array(recordingData);
        const imag = new Float32Array(fftSize);
    
        fft(real, imag);
    
        const amplitudes = new Float32Array(fftSize / 2);
        for (let i = 0; i < fftSize / 2; i++) {
            const mag = Math.sqrt(real[i] * real[i] + imag[i] * imag[i]);
            const dB = 20 * Math.log10(mag + 1e-10);
            amplitudes[i] = dB;
        }
    
        const noteSummaryData = calcNoteSummary(amplitudes, fftSize, sampleRate);
    
        const now = new Date();
        const dateStr = now.getFullYear() + "-" +
                        String(now.getMonth() + 1).padStart(2, '0') + "-" +
                        String(now.getDate()).padStart(2, '0') + " " +
                        String(now.getHours()).padStart(2, '0') + ":" +
                        String(now.getMinutes()).padStart(2, '0') + ":" +
                        String(now.getSeconds()).padStart(2, '0');
    
        const graphId = String(graphCounter).padStart(2, '0');
        graphCounter++;
    
        const graphData = {
            id: graphId,
            date: dateStr,
            amplitudes: amplitudes,
            fftSize: fftSize,
            sampleRate: sampleRate,
            noteSummaryData: noteSummaryData
        };
    
        // 最大枚数を超えた場合、一番古いグラフを削除
        if (savedGraphs.length >= MAX_GRAPHS) {
            savedGraphs.shift(); // 先頭のグラフを削除
        }
    
        savedGraphs.push(graphData);
    
        // 自動で新しいグラフを選択
        selectedGraphId = graphId;
        singleViewMode = true;
    
        updateSavedGraphsButtons();
        redrawAllGraphs();
        updateViewModeButtons(); // ここでビュー切り替えボタンを再更新する
    }

    function calcNoteSummary(amplitudes, fftSize, sampleRate){
        const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
        const noteData = {};
        for (const nName of noteNames) {
            noteData[nName] = [];
        }

        function freqToIndex(freq) {
            return Math.round(freq * fftSize / sampleRate);
        }

        // 各オクターブでのmin/max正規化用
        const octaveNorms = {};
        for (const octave of octaves) {
            const startIndex = freqToIndex(octave.rangeStart);
            const endIndex = Math.min(freqToIndex(octave.rangeEnd), amplitudes.length-1);

            let minVal = Infinity;
            let maxVal = -Infinity;
            for (let i = startIndex; i <= endIndex; i++) {
                const val = amplitudes[i];
                if (val < minVal) minVal = val;
                if (val > maxVal) maxVal = val;
            }
            octaveNorms[octave.name] = {minVal, maxVal};
        }

        for (const octave of octaves) {
            for (const note of octave.notes) {
                const baseNoteName = note.name.replace(/[0-9]/g,'');
                const startIdx = freqToIndex(note.fStart);
                const endIdx = Math.min(freqToIndex(note.fEnd), amplitudes.length - 1);
                let sumVal = 0;
                let count = 0;
                for (let i = startIdx; i <= endIdx; i++) {
                    sumVal += amplitudes[i];
                    count++;
                }
                if (count > 0) {
                    const avg = sumVal / count;
                    noteData[baseNoteName].push(avg);
                }
            }
        }

        const noteAvgIntensity = [];
        const vc0notes = octaves[0].notes;
        const noteColorMap = {};
        for (const nName of noteNames) {
            const values = noteData[nName];
            const avgAll = values.reduce((a,b)=>a+b,0)/values.length;
            noteAvgIntensity.push({name:nName, avg:avgAll});

            const vc0Note = vc0notes.find(nt => nt.name.replace(/[0-9]/g,'')===nName);
            if (vc0Note) {
                noteColorMap[nName] = vc0Note.color;
            } else {
                noteColorMap[nName] = "#000000";
            }
        }

        const sumAll = noteAvgIntensity.reduce((acc,cur)=>acc+cur.avg,0);
        for (const ni of noteAvgIntensity) {
            ni.ratio = sumAll > 0 ? (ni.avg / sumAll)*100 : 0;
            ni.color = noteColorMap[ni.name];
        }

        return noteAvgIntensity;
    }

    function updateSavedGraphsButtons() {
        savedGraphsBtns.innerHTML = ''; // ボタンを再生成
    
        for (const g of savedGraphs) {
            const btn = document.createElement('button');
            btn.className = 'graphBtn';
            btn.textContent = g.id;
    
            // 現在のモードに応じてボタン状態を設定
            if (singleViewMode && selectedGraphId === g.id) {
                btn.classList.add('selected'); // ON状態
            } else {
                btn.classList.remove('selected'); // OFF状態
            }
    
            btn.title = g.date;
            btn.addEventListener('click', () => {
                selectedGraphId = g.id; // 該当のグラフを選択
                singleViewMode = true; // 1枚表示モードに切り替え
                updateViewModeButtons(); // ビューボタン更新
                updateSavedGraphsButtons(); // 数字ボタン更新
                redrawAllGraphs(); // グラフ更新
            });
    
            savedGraphsBtns.appendChild(btn);
        }

        // 最大枚数チェックして警告を表示
        if (savedGraphs.length >= MAX_GRAPHS) {
            warningMessage.style.display = 'block';
        } else {
            warningMessage.style.display = 'none';
        }
    }

    function redrawAllGraphs() {
        graphsContainer.innerHTML = '';

        if (savedGraphs.length === 0) return;

        // 親要素である#graphAreaを取得
        const graphArea = document.getElementById('graphArea');

        if (singleViewMode) {
            graphArea.classList.add('singleView');
            graphArea.classList.remove('multipleView');

            const graph = savedGraphs.find(g=>g.id===selectedGraphId) 
                         || savedGraphs[savedGraphs.length - 1];

            selectedGraphId = graph ? graph.id : null;
        
            // Single view の描画
            if (graph) {
                drawGraph(graph, "single");
            }

        } else {
            graphArea.classList.remove('singleView');
            graphArea.classList.add('multipleView');

            savedGraphs.forEach(g => drawGraph(g, "multiple"));
        }
    }

    function showNoteSummary(parent, data, showRatio = true) {
        if (!data) return;
        // 念のため、最初に空にしておく
        parent.innerHTML = '';

        const noteLabelMap = {
            "C":"R", "C#":"C", "D":"O", "D#":"G", "E":"Y", "F":"L",
            "F#":"E", "G":"A", "G#":"B", "A":"N", "A#":"V", "B":"M"
        };

        // 構成比の小さい順にソート
        const arr = [...data];
        arr.sort((a,b)=>a.ratio - b.ratio);

        for (let i=0;i<arr.length;i++){
            const item=arr[i];
            const div=document.createElement('div');
            div.className='noteBox';
            // 最大上位3つ or 最小下位3つ は目立たせたい例(元のロジック準拠)
            if (i<3 || i>=arr.length-3) {
                div.style.backgroundColor=item.color;
                div.style.fontSize='0.5em'; 
                div.style.padding='3px'; 
            } else {
                div.style.fontSize='0.5em'; 
                div.style.padding='1px'; 
            }
            const line1=document.createElement('div');
            line1.textContent=noteLabelMap[item.name] || item.name;
            
            // ★ showRatio が true のときだけ構成比を表示する
            const line2=document.createElement('div');
            if (showRatio) {
                line2.textContent=`${item.ratio.toFixed(1)}`;
            } else {
                line2.textContent=''; // あるいは line2 を作らない手もある
            }
            
            div.appendChild(line1);
            div.appendChild(line2);
            parent.appendChild(div);
        }
    }
    
    function addGraphClickListener(graphDiv, graphId) {
        graphDiv.addEventListener('click', () => {
            const clickedId = graphDiv.getAttribute('data-graph-id');
            console.log(`Clicked Graph ID: ${clickedId}`);
            if (clickedId !== graphId) {
                console.error(`ID mismatch! Expected: ${graphId}, Got: ${clickedId}`);
            }
            selectedGraphId = clickedId;
            
            singleViewMode = true; // シングルビューに切り替え
            updateViewModeButtons(); // ビュー切り替えボタンを更新
            redrawAllGraphs(); // グラフを再描画
        });
    }
    
    function drawGraph(graph, viewMode = "single") {
        const {id, date, amplitudes, fftSize, sampleRate, noteSummaryData} = graph;

        // 親のDOM生成
        const graphDiv = document.createElement('div');
        graphDiv.className = 'graphCanvasContainer';
        graphDiv.setAttribute('data-graph-id', id); // グラフIDを属性として追加
        console.log(`Drawing Graph ID: ${id}`);

        // ヘッダ(タイトル + 削除ボタン)を生成
        const headerDiv = document.createElement('div');
        headerDiv.className = 'graphHeader';
        const infoSpan = document.createElement('span');
        infoSpan.textContent = `#${id} (${date})`;
        headerDiv.appendChild(infoSpan);
        
        const delBtn = document.createElement('button');
        delBtn.className = 'deleteBtn';
        delBtn.innerHTML = '<i class="fas fa-trash"></i>';

        delBtn.addEventListener('click', () => {
            event.stopPropagation(); // イベントのバブリングを防ぐ

            if (confirm(`グラフ #${id} を削除しますか？`)) {
                const idx = savedGraphs.findIndex(g => g.id === id);
                if (idx >= 0) {
                    savedGraphs.splice(idx, 1);
                    if (selectedGraphId === id) {
                        selectedGraphId = null;
                    }
                    updateSavedGraphsButtons();
                    redrawAllGraphs();
                }
            } else {
                // キャンセル時の処理（何もしない）
                console.log(`削除操作がキャンセルされました。`);
            }
        });

        headerDiv.appendChild(delBtn);
        graphDiv.appendChild(headerDiv);

        // ここでモード別にノートサマリーを表示するか判定
        // （今後「複数ビューでも描く」なら両方とも true にする）
        if (viewMode === "single") {
            const summaryContainer = document.createElement('div');
            // 必要ならCSSクラスを付与
            // summaryContainer.className = 'noteSummaryContainer';
            
            // ノートサマリー描画
            showNoteSummary(summaryContainer, noteSummaryData, true);

            // graphDiv に追加
            graphDiv.appendChild(summaryContainer);
        } else if (viewMode === "multiple") {
            // 複数ビュー: 構成比非表示( showRatio=false )
            const summaryContainer = document.createElement('div');
            showNoteSummary(summaryContainer, noteSummaryData, false);
            graphDiv.appendChild(summaryContainer);
        }

        // キャンバス生成
        const canvas = document.createElement('canvas');
        const graphWidth = Math.min(window.innerWidth, 600)*0.9;
        canvas.width = graphWidth;
        canvas.height = graphWidth; 
        graphDiv.appendChild(canvas);

        // グラフ描画
        const ctx = canvas.getContext('2d');
        drawCurrentGraphOnCanvas(ctx, amplitudes, fftSize, sampleRate);
        
        // クリックリスナーを追加
        addGraphClickListener(graphDiv, id);

        // 最終的に #graphsContainer に追加
        graphsContainer.appendChild(graphDiv);
    }

    function drawCurrentGraphOnCanvas(ctx, amplitudes, fftSize, sampleRate) {
        const rows = 13; 
        const cols = 5; 
        const canvasWidth = ctx.canvas.width;
        const canvasHeight = ctx.canvas.height;
        const cellWidth = Math.floor(canvasWidth / cols);
        const cellHeight = Math.floor(canvasHeight / rows);

        const circleNotesOrder = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
        const octaveCircleOrder = ["VC0","VC1","VC2-1","VC2-2"];
        const baseRadii = { "VC0":canvasWidth*0.416, "VC1":canvasWidth*0.333, "VC2-1":canvasWidth*0.25, "VC2-2":canvasWidth*0.166 };

        if(!amplitudes) return;
        
        function freqToIndex(freq) { return Math.round(freq * fftSize / sampleRate); }

        // オクターブ毎の正規化用
        const octaveNorms = {};
        for (const octave of octaves) {
            if(!octaveStates[octave.name]) continue;
            const startIndex = freqToIndex(octave.rangeStart);
            const endIndex = Math.min(freqToIndex(octave.rangeEnd), amplitudes.length-1);
            let minVal = Infinity;
            let maxVal = -Infinity;
            for (let i = startIndex; i <= endIndex; i++) {
                const val = amplitudes[i];
                if (val < minVal) minVal = val;
                if (val > maxVal) maxVal = val;
            }
            octaveNorms[octave.name] = {minVal, maxVal};
        }

        function reversedNotes(octave) {
            return [...octave.notes].reverse();
        }

        if(currentGraphType==="line"){
            // 背景グリッド
            ctx.fillStyle='white';
            ctx.fillRect(0,0,canvasWidth,canvasHeight);
            ctx.strokeStyle='#ccc';
            for (let r=0;r<=rows;r++){
                ctx.beginPath();
                ctx.moveTo(0,r*cellHeight);
                ctx.lineTo(canvasWidth,r*cellHeight);
                ctx.stroke();
            }
            for (let c=0;c<=cols;c++){
                ctx.beginPath();
                ctx.moveTo(c*cellWidth,0);
                ctx.lineTo(c*cellWidth,canvasHeight);
                ctx.stroke();
            }

            ctx.fillStyle='black';
            ctx.font='10px sans-serif';
            for (let c=0; c<topHeaders.length; c++) {
                const text = topHeaders[c];
                const x = (c+1)*cellWidth + 2; 
                const y = 10; 
                ctx.fillText(text, x, y);
            }

            for (let r=0;r<leftHeaders.length;r++){
                const text=leftHeaders[r];
                const x=2;
                const y=(r+1)*cellHeight+10;
                ctx.fillText(text,x,y);
            }

            for (let o=0;o<octaves.length;o++){
                const octave=octaves[o];
                if(!octaveStates[octave.name]) continue;
                const oNorm=octaveNorms[octave.name];
                if(!oNorm) continue;
                const {minVal,maxVal}=oNorm;
                const normalize=(val)=>(val-minVal)*100/(maxVal-minVal);

                const revNotes = reversedNotes(octave);
                for (let n=0;n<revNotes.length;n++){
                    const note=revNotes[n];
                    const cellX=(o+1)*cellWidth;
                    const cellY=(n+1)*cellHeight;
                    const startIndex=Math.max(0,freqToIndex(note.fStart));
                    const endIndex=Math.min(amplitudes.length-1,freqToIndex(note.fEnd));

                    const xScale=(cellWidth)/(note.fEnd - note.fStart);

                    ctx.beginPath();
                    ctx.strokeStyle=note.color;
                    let firstPoint=true;
                    for (let idx=startIndex;idx<=endIndex;idx++){
                        const freq=idx*sampleRate/fftSize;
                        const val=normalize(amplitudes[idx]);
                        const clippedVal=Math.max(intensityMin,Math.min(100,val));
                        const y=cellY + cellHeight - ((clippedVal - intensityMin)*(cellHeight/(100-intensityMin)));
                        const x=cellX + (freq - note.fStart)*xScale;
                        if(firstPoint){ctx.moveTo(x,y);firstPoint=false;}
                        else ctx.lineTo(x,y);
                    }
                    ctx.stroke();

                    ctx.fillStyle='black';
                    ctx.font='10px sans-serif';
                    ctx.fillText(`${note.name} (${note.fStart.toFixed(1)} - ${note.fEnd.toFixed(1)} Hz)`, cellX+2, cellY+10);
                }
            }
        } else {
            // circle
            ctx.fillStyle='white';
            ctx.fillRect(0,0,canvasWidth,canvasHeight);
            const cx=canvasWidth/2;
            const cy=canvasHeight/2;
            function degToRad(d){return d*Math.PI/180;}

            // 放射状ライン
            ctx.strokeStyle='gray';
            for (let i=0;i<12;i++){
                const angleDeg=210-(i*30);
                const angleRad=degToRad((angleDeg+360)%360);
                if (i===0||i===4||i===8) {
                    ctx.setLineDash([]);
                } else {
                    ctx.setLineDash([5,5]);
                }
                ctx.beginPath();
                ctx.moveTo(cx,cy);
                ctx.lineTo(
                    cx+(canvasWidth/2)*Math.cos(angleRad),
                    cy+(canvasHeight/2)*Math.sin(angleRad)
                );
                ctx.stroke();
            }
            ctx.setLineDash([]);

            function noteAngle(noteName){
                const baseName=noteName.replace(/[0-9]/g,'');
                const idx=circleNotesOrder.indexOf(baseName);
                let angle=(210 - idx*30)%360;
                if(angle<0)angle+=360;
                return angle;
            }

            for(const oName of octaveCircleOrder){
                if(!octaveStates[oName]) continue;
                const octave=octaves.find(o=>o.name===oName);
                const oNorm=octaveNorms[oName];
                if(!oNorm) continue;
                const {minVal,maxVal}=oNorm;
                const normalize=(val)=>(val-minVal)*(100/(maxVal-minVal));
                const baseR=baseRadii[oName];

                for(const note of octave.notes){
                    const startIndex = Math.max(0,freqToIndex(note.fStart));
                    const endIndex = Math.min(amplitudes.length-1,freqToIndex(note.fEnd));

                    ctx.beginPath();
                    ctx.strokeStyle=note.color;
                    let firstPoint=true;

                    for(let idx=startIndex;idx<=endIndex;idx++){
                        const freq=idx*sampleRate/fftSize;
                        const val=normalize(amplitudes[idx]);
                        const clippedVal=Math.max(intensityMin,Math.min(100,val));
                        const intensityRatio=(clippedVal-intensityMin)/(100-intensityMin);
                        const radius=baseR+intensityRatio*(canvasWidth*0.083);

                        const freqRatio=(freq - note.fStart)/(note.fEnd-note.fStart);
                        const startDeg=noteAngle(note.name);
                        let angleDeg = startDeg - freqRatio*30;
                        angleDeg=(angleDeg+360)%360;
                        const angleRad=degToRad(angleDeg);

                        const x=cx+radius*Math.cos(angleRad);
                        const y=cy+radius*Math.sin(angleRad);

                        if(firstPoint){ctx.moveTo(x,y);firstPoint=false;}
                        else ctx.lineTo(x,y);
                    }
                    ctx.stroke();
                }
            }

            // 同心円
            ctx.strokeStyle='gray';
            for(const oName of octaveCircleOrder){
                ctx.beginPath();
                ctx.arc(cx,cy,baseRadii[oName],0,2*Math.PI);
                ctx.stroke();
            }
        }
    }
